name: Skill metadata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontmatter parser
        run: python -m pip install PyYAML==6.0.2
      - name: Test metadata validation with synthetic fixtures
        run: python -m unittest discover -s Tools/skills -p 'test_*.py' -v
      - name: Validate every installable skill
        run: python Tools/skills/validate.py
