name: Skeleton CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax (empty until Ship lands)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- 'Tools/**/*.sh' |
            while IFS= read -r -d '' script; do
              bash -n "$script"
            done
      - name: Validate package JSON
        shell: bash
        run: |
          set -euo pipefail
          for manifest in Packages/*/package.json; do
            jq -e 'type == "object"' "$manifest" > /dev/null
          done
