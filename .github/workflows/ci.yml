name: Skeleton CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity metadata and assembly definitions
        run: |
          python3 -B Tools/ci/test-check-unity.py
          python3 -B Tools/ci/check-unity.py
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- 'Tools/**/*.sh' |
            while IFS= read -r -d '' script; do
              bash -n "$script"
            done
      - name: Validate package JSON
        shell: bash
        run: |
          set -euo pipefail
          validate_manifest() {
            jq -se 'length == 1 and (.[0] | type == "object")' > /dev/null
          }
          # Synthetic regressions: reject empty, non-object, malformed and streamed JSON.
          for invalid in '' '[]' '{invalid' $'{}\n{}'; do
            if printf '%s' "$invalid" | validate_manifest 2>/dev/null; then
              echo 'ERROR: invalid JSON fixture accepted' >&2
              exit 1
            fi
          done
          for manifest in Packages/*/package.json; do
            validate_manifest < "$manifest"
          done
